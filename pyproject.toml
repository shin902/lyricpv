[project]
name = "lyricpv"
version = "0.1.0"
description = "任意の楽曲から TextAlive 互換の解析データを生成し、文字PV(キネティックタイポグラフィMV)を作れるようにする SDK"
requires-python = ">=3.12,<3.13"
dependencies = [
    "demucs>=4.0.1",
    "fugashi[unidic-lite]>=1.4",
    "librosa>=0.10.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "syncedlyrics>=1.0",
    "torch>=2.5",
    "torchaudio>=2.5",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
webui = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
# --enhance-vocals 用 (UVR 系モデルでハモリ・残響除去 / #3)
enhance = [
    "audio-separator[cpu]>=0.30",
]
# --refine-align 用 (whisperx の CTC 強制アラインメント / #3, #6)
refine = [
    "whisperx>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.15.20",
]

[project.scripts]
lyricpv = "lyricpv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyricpv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
