[project]
name = "lyricpv"
version = "0.1.0"
description = "任意の楽曲から TextAlive 互換の解析データを生成し、文字PV(キネティックタイポグラフィMV)を作れるようにする SDK"
requires-python = ">=3.12,<3.13"
dependencies = [
    "demucs>=4.0.1",
    "fugashi[unidic-lite]>=1.4",
    "librosa>=0.10.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "syncedlyrics>=1.0",
    "torch>=2.5",
    "torchaudio>=2.5",
    "yt-dlp>=2025.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
lyricpv = "lyricpv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyricpv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
